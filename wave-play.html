<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WAVEPLAY-PENDING</title>
<style>html,body{margin:0;background:#16121c}</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>window.requestAnimationFrame = () => 0;</script> <!-- before the bundle: browser.js self-starts the loop -->
<script src="dist/hyperspell.js?nomenu"></script>
<!-- freeze auto rAF: we drive frame() synchronously off a mocked clock so the run
     completes instantly (headless Chrome can't drain a timer-driven loop for a shot) -->
<script>
// Real-play harness: boots the full game, drops in armed bots, starts a wave run,
// and drives the ACTUAL frame loop (physics + enemy AI + collisions + rendering)
// synchronously for ~10s of virtual time. Confirms enemies spawn, get fought, and
// die for real. The final canvas is left rendered for a --screenshot capture.
(function runPlay() {
  const R = { maxEnemies: 0, spawned: 0, killed: 0, wave: 0, aliveAtEnd: 0, frames: 0 };
  try {
    let T = 100000;
    performance.now = () => T;
    for (let i = 0; i < 3; i++) addBot();
    startRun();
    // spawnEnemy/killEnemy are module bindings now, so the counters watch the
    // live enemy set instead of wrapping the functions
    let live = new Set();
    const sampleEnemies = () => {
      for (const b of enemies) if (!live.has(b)) R.spawned++;
      for (const b of live) if (!enemies.has(b)) R.killed++;
      live = new Set(enemies);
    };
    for (const p of players) { p.slots[0] = 'fireball'; p.casts[0] = -1e9; } // arm the bots

    for (let i = 0; i < 300; i++) {           // ~10s at 33ms/frame, fully synchronous
      T += 33;
      frame(T);
      sampleEnemies();
      R.frames++;
      R.maxEnemies = Math.max(R.maxEnemies, enemies.size);
      R.wave = Math.max(R.wave, game.wave);
      if (game.state === 'RUN_OVER') break;
    }
    R.aliveAtEnd = players.filter(p => p.alive).length;

    // sample the canvas to prove rendering actually produced pixels (not blank)
    frame(T);
    const cv = document.getElementById('game');
    const px = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
    let lit = 0; for (let i = 0; i < px.length; i += 4 * 137) if (px[i] + px[i + 1] + px[i + 2] > 40) lit++;
    R.litPixelPct = Math.round(100 * lit / (px.length / (4 * 137)));

    const good = R.spawned >= 2 && R.maxEnemies >= 1 && R.killed >= 1 && game.mode === 'wave' && R.litPixelPct > 20;
    const verdict = good ? 'WAVEPLAY-PASS' : 'WAVEPLAY-FAIL';
    document.title = verdict;
    const pre = document.createElement('pre');
    pre.id = 'play'; pre.style.color = '#fff';
    pre.textContent = verdict + ' ' + JSON.stringify(R);
    document.body.appendChild(pre);
    frame(T); // final render for the screenshot
  } catch (e) {
    document.title = 'WAVEPLAY-FAIL';
    const pre = document.createElement('pre'); pre.id = 'play'; pre.style.color = '#f88';
    pre.textContent = 'WAVEPLAY-FAIL exception: ' + (e.stack || e.message || e);
    document.body.appendChild(pre);
  }
})();
</script>
</body>
</html>
