  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 16/9; background: #241d2e; }
  .cornerLink {
    position: fixed; right: 12px; z-index: 10;
    font: 12px/1 Georgia, serif; letter-spacing: 0.08em;
    color: #b98cff; text-decoration: none;
    background: rgba(20, 16, 27, 0.6); border: 1px solid #362a49;
    padding: 5px 10px; border-radius: 3px; opacity: 0.45;
    transition: opacity 0.2s, box-shadow 0.2s;
  }
  .cornerLink:hover { opacity: 1; box-shadow: 0 0 12px rgba(185, 140, 255, 0.5); }
  #galleryLink { top: 10px; }
  #guideLink { top: 42px; }
</style>
</head>

<canvas id="game" width="1280" height="720"></canvas>
<a id="galleryLink" class="cornerLink" href="art-gallery.html" target="_blank" rel="noopener">✦ Art Gallery</a>
